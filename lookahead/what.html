    <script>
        const lookahead = 4;
        const synth = new Tone.Synth().toDestination();

        let nextNumberToClick = 1;
        let positions = [];
        let interval;

        let lookup = [];

        for (let i = 2; i <= 64-lookahead; i+=lookahead) {
            let nextFour = [i+lookahead-1, i+lookahead, i+lookahead+1, i+lookahead+2];
            for (let j = nextFour.length - 1; j > 0; j--) {
                const k = Math.floor(Math.random() * (j + 1));
                [nextFour[j], nextFour[k]] = [nextFour[k], nextFour[j]];
            }
            for (let i = 0; i < nextFour.length; i++) {
                lookup.push(nextFour[i]);
            }
        }

        for (let i = 1; i <= 64; i++) {
            let randomSquare = Math.floor(Math.random() * 64) + 1;
            while (positions.includes(randomSquare)) {
                randomSquare = Math.floor(Math.random() * 64) + 1;
            }
            if (i <= 4) {
                document.getElementById(randomSquare).innerText = i.toString(5);
            }
            positions.push(randomSquare);
        }
        for (let i = 1; i <= 64; i++) {
            document.getElementById(i).addEventListener('click', function() {
                let e;
                if (parseInt(this.id)%8 == 0) {e = (7-Math.floor(parseInt(this.id)/8))*8+parseInt(this.id)%8+16;}
                else {e = (7-Math.floor(parseInt(this.id)/8))*8+parseInt(this.id)%8;}
                const QQQ = e;
                if (positions[nextNumberToClick-1] === QQQ) {
                    if (nextNumberToClick !== 64) synth.triggerAttackRelease(["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5", "B4", "A4", "G4", "F4", "E4", "D4"][(nextNumberToClick-1)%14], "32n");
                    document.getElementById("score").innerText = nextNumberToClick;
                    if (nextNumberToClick === 64) {
                        const now = Tone.now();
                        for (let i = 0; i < 8; i++) {
                            synth.triggerAttackRelease(["C5", "D5", "E5", "F5", "G5", "A5", "B5", "C6"][i], 0.08, now + i * 0.08);
                        }

                        clearInterval(interval);
                        document.getElementById("time").style.color = 'limegreen';
                        document.getElementById("pace").innerText = document.getElementById("time").innerText;
                        document.getElementById("pace").style.color = 'limegreen';
                        for (let j = 1; j <= 64; j++) {
                            document.getElementById(j).style.transition = 'background-color 2s ease, color 2s ease';
                            document.getElementById(j).style.pointerEvents = 'none';
                            document.getElementById(j).style.backgroundColor = 'limegreen';
                            document.getElementById(j).style.color = 'black';
                            document.getElementById(j).innerText = (positions.indexOf(j) + 1).toString(5);
                        }
                    }
                    if (nextNumberToClick === 1) {
                        if (!window.startTime) {
                            window.startTime = Date.now();
                            interval = setInterval(() => {
                                if (window.startTime) {
                                    const elapsed = Date.now() - window.startTime;
                                    const minutes = Math.floor(elapsed / 60000).toString().padStart(2, '0');
                                    const seconds = Math.floor((elapsed % 60000) / 1000).toString().padStart(2, '0');
                                    const milliseconds = (elapsed % 1000).toString().padStart(3, '0');
                                    document.getElementById("time").innerText = `${minutes}:${seconds}.${milliseconds}`;

                                    const pace = (elapsed * 64 / (nextNumberToClick-1));
                                    const paceMinutes = Math.floor(pace / 60000).toString().padStart(2, '0');
                                    const paceSeconds = Math.floor((pace % 60000) / 1000).toString().padStart(2, '0');
                                    const paceMilliseconds = Math.floor(pace % 1000).toString().padStart(3, '0');
                                    document.getElementById("pace").innerText = `${paceMinutes}:${paceSeconds}.${paceMilliseconds}`
                                }
                            }, 7);
                        }
                        for (let j = 2; j <= lookahead; j++) {
                            document.getElementById(positions[j-1]).innerText = '';
                        }
                    }
                    if (nextNumberToClick < 64) {
                        document.getElementById(QQQ).style.backgroundColor = 'limegreen';
                        document.getElementById(QQQ).style.color = 'limegreen';
                        setTimeout(() => {
                            document.getElementById(QQQ).style.transition = 'background-color 0.3s ease, color 0.3s ease';
                            document.getElementById(QQQ).style.backgroundColor = 'black';
                            document.getElementById(QQQ).style.color = 'black';
                            document.getElementById(QQQ).innerText = "";
                        }, 10);
                    }
                    nextNumberToClick++;
                    if (nextNumberToClick === 61) {
                        document.getElementById(positions[62]).innerText = "";
                    }

                    if (nextNumberToClick === 62) {
                        document.getElementById(positions[63]).innerText = "";
                    }

                    if (nextNumberToClick > 61) return;

                    if (nextNumberToClick > 2) {
                        document.getElementById(positions[lookup[nextNumberToClick-3]-1]).style.transition = 'background-color 0.3s ease, color 0.3s ease';
                        document.getElementById(positions[lookup[nextNumberToClick-3]-1]).style.backgroundColor = 'black';
                        document.getElementById(positions[lookup[nextNumberToClick-3]-1]).style.color = 'black';
                        document.getElementById(positions[lookup[nextNumberToClick-3]-1]).style.transition = 'none';
                    }

                    if (nextNumberToClick > 1) {
                        document.getElementById(positions[lookup[nextNumberToClick-2]-1]).innerText = lookup[nextNumberToClick-2].toString(5);
                    }
                } else {
                    synth.triggerAttackRelease("F2", "32n");
                    clearInterval(interval);
                    document.getElementById("time").style.color = 'red';
                    document.getElementById(QQQ).style.backgroundColor = 'red';
                    document.getElementById(positions[nextNumberToClick-1]).innerText = nextNumberToClick.toString(4);
                    document.getElementById(positions[nextNumberToClick-1]).style.color = '#fa0';
                    for (let j = 1; j <= 64; j++) {
                        document.getElementById(j).style.pointerEvents = 'none';
                    }
                }
            });
        }
        document.addEventListener('keydown', function(event) {
            if (event.key === 'r' || event.key === 'R') {
                location.reload();
            }
        });
